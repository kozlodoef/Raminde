apply plugin: 'com.android.application'

// Ключ подписи релиза.
//
// Файл android/keystore/keystore.properties в репозиторий не попадает (см.
// .gitignore): пароль от ключа подписи в открытом виде — это возможность
// выпустить обновление от вашего имени. Если файла нет, сборка не падает:
// релиз тогда подписывается отладочным ключом, и это видно в предупреждении.
def keystorePropsFile = rootProject.file('keystore/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "ru.voicereminder.app"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions { coreLibraryDesugaringEnabled true }
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "ru.voicereminder.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 25
        // Название версии без суффикса: «-sherpa» — это деталь реализации,
        // а не версия для магазина. Ру-store показывает её в карточке
        // обновления, и посторонний суффикс там выглядит как недоделка.
        versionName "1.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // sherpa-onnx поставляет готовые библиотеки под все основные ABI,
            // поэтому приложение работает и на старых 32-битных телефонах,
            // и на новых 64-битных. x86 оставлен для эмулятора: без него
            // отладка на нём невозможна, а места он занимает немного.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // Модель распознавания читается напрямую из assets, без сжатия:
            // иначе пришлось бы распаковывать 70 МБ при каждом запуске.
            noCompress 'onnx', 'txt'
        }
    }
    // signingConfigs обязан идти до buildTypes: при обратном порядке
    // gradle ещё не знает конфигурацию release и падает на «Could not get
    // unknown property 'release' for SigningConfig container».
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file("../keystore/" + keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // RuStore не принимает сборки, подписанные отладочным
            // сертификатом, и требует debuggable="false" (п. 2.14).
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Ключа может не быть — например, на чужой машине при первом
            // запуске. Тогда релиз подписывается отладочным, чтобы сборка
            // не падала; перед публикацией файл keystore.properties должен
            // существовать.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    // Раздельные сборки по архитектурам: телефон скачивает только свою,
    // а не все четыре набора библиотек сразу. Для отладки на конкретном
    // устройстве это экономит десятки мегабайт.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    // Распознавание речи: sherpa-onnx. Модели подключаются из assets,
    // интернет не нужен. Библиотека написана на Kotlin, поэтому нужен
    // kotlin-stdlib — без него сборка падает на его классах.
    implementation files('libs/sherpa-onnx-2.0.2.aar')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    testImplementation "org.json:json:20250517"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
